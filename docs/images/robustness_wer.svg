<svg xmlns='http://www.w3.org/2000/svg' width='860' height='442' viewBox='0 0 860 442' role='img' aria-label='Robustness: Swahili word error rate under degraded audio (lower is better)' font-family='Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif'>
