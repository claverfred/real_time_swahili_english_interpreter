# Base configuration. Every other profile inherits from this file.
# Model IDs are *candidates*; selection is decided by the Phase 3/4/5/8 benchmarks,
# not assumed. Revisions are pinned to an exact commit once benchmarked ("main" until then).

profile: default
description: Base settings shared by all profiles.

environment:
  platform: auto        # auto | local | colab | hpc
  device: auto          # auto | cpu | cuda
  gpu_index: 0
  precision: auto       # auto | fp32 | fp16 | bf16 | int8 | int8_float16
  cpu_threads: 0        # 0 = automatic (physical cores)
  seed: 1234

audio:
  sample_rate: 16000
  channels: 1
  frame_ms: 30
  max_input_seconds: 3600
  max_input_mb: 500

vad:
  backend: silero       # silero | webrtc | energy   (fallback chain: silero -> webrtc -> energy)
  threshold: 0.5        # speech probability; for webrtc it maps to aggressiveness 0-3
  min_speech_ms: 250    # consecutive speech needed to open a segment (filters clicks)
  min_silence_ms: 500   # silence needed to close a segment
  speech_pad_ms: 200    # audio kept before speech onset
  hangover_ms: 300      # audio kept after the last speech frame
  max_utterance_s: 20.0 # force-split long turns so ASR latency stays bounded
  silero_model_path: null
  allow_model_download: true

asr:
  backend: faster_whisper
  model: large-v3-turbo
  revision: main
  license: MIT
  language: sw          # forced; no auto language switching
  task: transcribe
  compute_type: auto
  beam_size: 5
  chunk_s: 1.0
  overlap_s: 0.5
  stable_prefix_agreement: 2   # local-agreement passes before a prefix is committed
  word_timestamps: false
  condition_on_previous_text: false   # reduces hallucination loops
  no_speech_threshold: 0.6
  log_prob_threshold: -1.0
  compression_ratio_threshold: 2.4
  corrections_path: configs/asr_corrections/sw.csv   # recurring mishearings -> fixed before MT; null disables
  fallback_models: [small]

text:
  capitalize: true
  add_final_punct: true
  max_sentence_words: 40          # force a clause-level break in run-on speech
  hold_incomplete_on_split: true  # after a max-duration split, wait for the sentence to finish

mt:
  backend: nllb         # nllb | marian | m2m
  model: facebook/nllb-200-distilled-600M
  revision: main
  license: CC-BY-NC-4.0   # non-commercial; see docs before any commercial use
  engine: auto          # auto (ctranslate2 if convertible, else transformers) | ctranslate2 | transformers
  compute_type: auto    # follows environment.precision (int8 on CPU)
  src_lang: swh_Latn
  tgt_lang: eng_Latn
  beam_size: 4
  max_tokens: 256
  context_sentences: 2
  context_mode: none    # none | prefix (forced-decode the previous translation)
  translate_partials: false   # only stable prefixes / finals are translated
  partial_min_new_words: 3
  entity_strategy: verify     # verify | mask (numbers/glossary terms masked through MT)
  max_length_ratio: 3.0       # output/input words above this is flagged as possible hallucination
  uncertain_policy: translate_flagged   # translate_flagged | skip
  glossary_path: null
  cache_size: 2048
  fallback_models: [Helsinki-NLP/opus-mt-swc-en]

tts:
  backend: piper        # piper | kokoro | sapi | edge (cloud) | mms
  model: rhasspy/piper-voices
  revision: 42301ec547bc2939386cf0ae9f9050ca05b1d3af   # pinned piper-voices commit
  # Voice measured 2026-11-20 (scripts/tts_eval.py, 33 sentences, Whisper round-trip WER):
  #   libritts_r 0.074 (CC BY 4.0) | lessac 0.071 (Blizzard-2013 licence, restricted) | joe 0.092 (CC0)
  license: "voice data CC BY 4.0 (LibriTTS-R; attribution required); piper engine GPL-3.0"
  voice: en_US-libritts_r-medium
  sample_rate: 22050
  chunk_max_chars: 220
  first_chunk_max_chars: 80
  speaker_id: null
  speaking_rate: 1.0
  sentence_pause_ms: 120
  fade_ms: 5.0
  trim_silence: true
  target_rms_dbfs: -20.0
  spell_acronyms: true
  pronunciation_dict: null      # csv/json/yaml: word -> spoken form
  voices: {kokoro: af_heart, sapi: default, edge: en-US-AriaNeural, mms: facebook/mms-tts-eng}
  voice_cloning: false          # never without explicit, documented consent
  fallback_backends: []         # cloud backends (edge) only via profiles with allow_cloud
  allow_model_download: true

streaming:
  buffer_ms: 200
  queue_max: 64
  retry_count: 2
  timeout_s: 30.0

fallback:
  policy: allow_logged  # allow_logged | fail  — fallbacks are never silent
  allow_cloud: false

storage:
  cache_dir: cache
  output_dir: results
  log_dir: logs

logging:
  level: INFO
  json: true
  log_text: true
  log_audio: false      # private audio is never logged unless requested

privacy:
  data_class: public    # public | licensed | restricted | private
  allow_cloud_upload: false
  retention_days: 30
  delete_temp_audio: true
  session_timeout_min: 60
