[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-swahili-english"
version = "0.1.0"
description = "Modular real-time Swahili-to-English speech interpretation (VAD -> ASR -> MT -> TTS)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Project contributors" }]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "numpy>=1.24",
]

[project.optional-dependencies]
# Local Windows / CPU extras
local = ["sounddevice>=0.4.6"]
audio = ["soundfile>=0.12", "soxr>=0.3.7", "webrtcvad-wheels>=2.0.11", "onnxruntime>=1.17"]
asr = ["faster-whisper>=1.0.3"]
mt = ["transformers>=4.40,<5","sentencepiece>=0.2", "sacremoses>=0.1", "ctranslate2>=4.3"]
tts = ["piper-tts>=1.5", "edge-tts>=7.0", "comtypes>=1.4; sys_platform == 'win32'"]
# Kokoro is optional: on the local 10-core CPU its int8 model ran at RTF ~1.8 (slower than real time).
tts-kokoro = ["kokoro-onnx>=0.6"]
torch = ["torch>=2.2", "torchaudio>=2.2"]
ui = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "gradio>=4.30", "python-multipart>=0.0.9"]
eval = ["jiwer>=3.0", "sacrebleu>=2.4", "datasets>=2.19", "pandas>=2.0"]
finetune = ["accelerate>=0.30", "peft>=0.11", "evaluate>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: requires model downloads or heavy compute (deselect with -m 'not slow')",
    "gpu: requires a CUDA GPU",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
